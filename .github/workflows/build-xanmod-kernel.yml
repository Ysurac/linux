name: Build XanMod Patched Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_series:
        description: Kernel series to patch (for example 7.0.y)
        required: false
        default: 7.0.y
      patch_repo_url:
        description: URL of the patch repository
        required: false
        default: https://gitlab.com/xanmod/linux-patches.git

permissions:
  contents: read

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: x86_64
            kernel_arch: x86_64
            cross_compile: ""
            image_target: bzImage
            image_path: arch/x86/boot/bzImage
            extra_packages: ""
          - artifact_arch: arm64
            kernel_arch: arm64
            cross_compile: aarch64-linux-gnu-
            image_target: Image
            image_path: arch/arm64/boot/Image
            extra_packages: gcc-aarch64-linux-gnu

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            dwarves \
            flex \
            libelf-dev \
            libssl-dev \
            rsync \
            ${{ matrix.extra_packages }}

      - name: Apply XanMod patch stack
        run: |
          set -euo pipefail
          bash .github/scripts/apply-xanmod-patches.sh \
            "${{ github.event.inputs.kernel_series || '7.0.y' }}" \
            "${{ github.event.inputs.patch_repo_url || 'https://gitlab.com/xanmod/linux-patches.git' }}"

      - name: Configure kernel
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          mkdir -p "${build_dir}"
          make O="${build_dir}" ARCH="${{ matrix.kernel_arch }}" CROSS_COMPILE="${{ matrix.cross_compile }}" defconfig

      - name: Build kernel image and modules
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          make -j"$(nproc)" \
            O="${build_dir}" \
            ARCH="${{ matrix.kernel_arch }}" \
            CROSS_COMPILE="${{ matrix.cross_compile }}" \
            "${{ matrix.image_target }}" modules

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.artifact_arch }}
          path: |
            build-${{ matrix.artifact_arch }}/${{ matrix.image_path }}
            build-${{ matrix.artifact_arch }}/.config
          if-no-files-found: error
          retention-days: 7
