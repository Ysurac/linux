name: Build XanMod Patched Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_series:
        description: Kernel series to patch (for example 6.18.y)
        required: false
        default: 6.18.y
      patch_repo_url:
        description: URL of the patch repository
        required: false
        default: https://gitlab.com/xanmod/linux-patches.git
      stable_patch_url:
        description: URL of the upstream stable patch archive to apply
        required: false
        default: https://cdn.kernel.org/pub/linux/kernel/v6.x/patch-6.18.26.xz
      mptcp_patch_url:
        description: URL of the MPTCP BPF scheduler patch
        required: false
        default: https://github.com/Ysurac/openmptcprouter/blob/develop/6.18/target/linux/generic/hack-6.18/999-mptcp-bpf-scheduler.patch
      xanmod_config_url:
        description: XanMod x86_64 config URL
        required: false
        default: https://gitlab.com/xanmod/linux/-/raw/6.18/CONFIGS/x86_64/config
      exclude_patch_dirs:
        description: Comma-separated patch subdirectories to skip (for example binder,valve)
        required: false
        default: "pci_acso,valve"
      skip_failed_patches:
        description: Continue when a patch cannot be applied cleanly
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: x86_64-x64v1
            kernel_arch: x86_64
            cross_compile: ""
            image_target: bzImage
            image_path: arch/x86/boot/bzImage
            extra_packages: ""
            x86_64_level: "1"
            isa_id: x64v1
            localversion_suffix: -omr-x64v1
          - artifact_arch: x86_64-x64v2
            kernel_arch: x86_64
            cross_compile: ""
            image_target: bzImage
            image_path: arch/x86/boot/bzImage
            extra_packages: ""
            x86_64_level: "2"
            isa_id: x64v2
            localversion_suffix: -omr-x64v2
          - artifact_arch: x86_64-x64v3
            kernel_arch: x86_64
            cross_compile: ""
            image_target: bzImage
            image_path: arch/x86/boot/bzImage
            extra_packages: ""
            x86_64_level: "3"
            isa_id: x64v3
            localversion_suffix: -omr-x64v3
          - artifact_arch: arm64
            kernel_arch: arm64
            cross_compile: aarch64-linux-gnu-
            image_target: Image
            image_path: arch/arm64/boot/Image
            extra_packages: gcc-aarch64-linux-gnu
            x86_64_level: ""
            isa_id: generic
            localversion_suffix: -omr

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            debhelper \
            dwarves \
            fakeroot \
            flex \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            rsync \
            xz-utils \
            ${{ matrix.extra_packages }}

      - name: Apply XanMod patch stack
        run: |
          set -euo pipefail
          bash .github/scripts/apply-xanmod-patches.sh \
            "${{ github.event.inputs.kernel_series || '6.18.y' }}" \
            "${{ github.event.inputs.patch_repo_url || 'https://gitlab.com/xanmod/linux-patches.git' }}" \
            "${{ github.event.inputs.exclude_patch_dirs || 'pci_acso,valve' }}" \
            "${{ github.event.inputs.skip_failed_patches || 'true' }}"

      - name: Apply upstream and OMR patches
        run: |
          set -euo pipefail
          stable_patch_url="${{ github.event.inputs.stable_patch_url || 'https://cdn.kernel.org/pub/linux/kernel/v6.x/patch-6.18.26.xz' }}"
          mptcp_patch_url="${{ github.event.inputs.mptcp_patch_url || 'https://github.com/Ysurac/openmptcprouter/blob/develop/6.18/target/linux/generic/hack-6.18/999-mptcp-bpf-scheduler.patch' }}"

          normalize_url() {
            local url="$1"
            if [[ "${url}" == *"github.com"*"/blob/"* ]]; then
              echo "${url}" | sed -E 's#https://github.com/([^/]+)/([^/]+)/blob/([^/]+)/(.+)#https://raw.githubusercontent.com/\1/\2/\3/\4#'
              return
            fi
            echo "${url}"
          }

          if ! git config --get user.name >/dev/null; then
            git config user.name "github-actions[bot]"
          fi

          if ! git config --get user.email >/dev/null; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
          fi

          apply_patch_file() {
            local patch_file="$1"
            local patch_label="$2"

            echo "Applying ${patch_label}"

            if git am --3way "${patch_file}"; then
              return
            fi

            git am --abort || true

            if git apply --check "${patch_file}"; then
              git apply "${patch_file}"
              git add -A
              git commit -m "Apply ${patch_label}"
              return
            fi

            if patch -p1 --forward < "${patch_file}"; then
              git add -A
              git commit -m "Apply ${patch_label}"
              return
            fi

            echo "Failed to apply ${patch_label}"
            exit 1
          }

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          stable_archive="${tmp_dir}/stable.patch.xz"
          stable_patch="${tmp_dir}/stable.patch"
          curl -fL "$(normalize_url "${stable_patch_url}")" -o "${stable_archive}"
          unxz -c "${stable_archive}" > "${stable_patch}"
          apply_patch_file "${stable_patch}" "upstream stable patch $(basename "${stable_patch_url}")"

          mptcp_patch="${tmp_dir}/mptcp-bpf-scheduler.patch"
          curl -fL "$(normalize_url "${mptcp_patch_url}")" -o "${mptcp_patch}"
          apply_patch_file "${mptcp_patch}" "MPTCP BPF scheduler patch"

      - name: Configure kernel
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          mkdir -p "${build_dir}"
          make O="${build_dir}" ARCH="${{ matrix.kernel_arch }}" CROSS_COMPILE="${{ matrix.cross_compile }}" defconfig

      - name: Fetch XanMod kernel config
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          bash .github/scripts/fetch-xanmod-config.sh \
            "${{ matrix.kernel_arch }}" \
            "${build_dir}/.config" \
            "${{ github.event.inputs.xanmod_config_url || 'https://gitlab.com/xanmod/linux/-/raw/6.18/CONFIGS/x86_64/config' }}"

      - name: Apply kernel branding
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          scripts/config --file "${build_dir}/.config" \
            --set-str LOCALVERSION "${{ matrix.localversion_suffix }}"

      - name: Apply x86_64 ISA tuning
        if: matrix.kernel_arch == 'x86_64'
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"

          if grep -Rqs '^[[:space:]]*config[[:space:]]+X86_64_VERSION$' arch/x86; then
            scripts/config --file "${build_dir}/.config" \
              --set-val X86_64_VERSION "${{ matrix.x86_64_level }}"
          fi

      - name: Prepare kernel config (olddefconfig)
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          make O="${build_dir}" ARCH="${{ matrix.kernel_arch }}" CROSS_COMPILE="${{ matrix.cross_compile }}" olddefconfig

      - name: Build kernel image and modules
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          make -j"$(nproc)" \
            O="${build_dir}" \
            ARCH="${{ matrix.kernel_arch }}" \
            CROSS_COMPILE="${{ matrix.cross_compile }}" \
            "${{ matrix.image_target }}" modules

      - name: Adjust Debian packaging compat level
        run: |
          set -euo pipefail
          # Ubuntu 24.04 ships debhelper compat 13; kernel script defaults to 12.
          sed -i 's/debhelper-compat (= 12)/debhelper-compat (= 13)/' scripts/package/mkdebian

      - name: Build Debian kernel package
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          lv="$(make -s O="${build_dir}" ARCH="${{ matrix.kernel_arch }}" CROSS_COMPILE="${{ matrix.cross_compile }}" kernelrelease)"
          dpkg_flags=""
          deb_build_profiles=""
          if [ "${{ matrix.kernel_arch }}" = "arm64" ]; then
            # Cross-build on amd64 runner: skip dpkg-checkbuilddeps for arm64 host deps.
            dpkg_flags="-d"
            # Skip debug symbol package in cross build to avoid fragile image-dbg stage.
            deb_build_profiles="pkg.linux-upstream.nokerneldbg"
          fi
          export DEBFULLNAME="Alexandre Frade"
          export DEBEMAIL="kernel@xanmod.org"
          export DEB_BUILD_PROFILES="${deb_build_profiles}"

          make -j"$(nproc)" \
            O="${build_dir}" \
            ARCH="${{ matrix.kernel_arch }}" \
            CROSS_COMPILE="${{ matrix.cross_compile }}" \
            KDEB_BUILDDIR="${build_dir}" \
            KDEB_CHANGELOG_DIST="noble" \
            KDEB_PKGVERSION="${lv}" \
            KBUILD_PACKAGE_ORIGIN="XanMod" \
            KBUILD_BUILD_VERSION="1" \
            DPKG_FLAGS="${dpkg_flags}" \
            bindeb-pkg 2>&1 | tee "${build_dir}/bindeb.log"

      - name: Collect Debian packages
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          artifact_dir="deb-packages-${{ matrix.kernel_arch }}-${{ matrix.isa_id }}"
          mkdir -p "${artifact_dir}"
          find . -maxdepth 2 -type f \( -name "*.deb" -o -name "*.buildinfo" -o -name "*.changes" \) ! -name "*dbg*" -exec cp {} "${artifact_dir}/" \; 2>/dev/null || echo "No DEB packages found"

          # Debian files are <package>_<version>_<arch>.deb. Kernel packages also embed
          # the same version in <package>, so normalize copied artifact names to keep it once.
          for deb in "${artifact_dir}"/*.deb; do
            [ -e "${deb}" ] || break
            base="$(basename "${deb}")"
            pkg="${base%%_*}"
            rest="${base#*_}"
            ver="${rest%%_*}"
            arch_part="${rest#*_}"

            if [[ "${pkg}" == *-"${ver}" ]]; then
              short_pkg="${pkg%-$ver}"
              new_name="${short_pkg}_${ver}_${arch_part}"
              mv -f "${deb}" "${artifact_dir}/${new_name}"
            fi
          done

          cp "${build_dir}/bindeb.log" "${artifact_dir}/" 2>/dev/null || true
          ls -lh "${artifact_dir}"/ || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb-${{ matrix.kernel_arch }}-${{ matrix.isa_id }}
          path: deb-packages-${{ matrix.kernel_arch }}-${{ matrix.isa_id }}
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    runs-on: ubuntu-24.04
    needs: patch-and-build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-deb-*
          path: release-assets
          merge-multiple: true

      - name: Generate release metadata
        id: release_meta
        run: |
          set -euo pipefail
          dv="$(date +%Y%m%d)"
          sha="${GITHUB_SHA::7}"
          tag="omr-kernel-${dv}-${GITHUB_RUN_NUMBER}-${sha}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=OMR Kernel ${dv} (run ${GITHUB_RUN_NUMBER})" >> "${GITHUB_OUTPUT}"

      - name: Show release files
        run: |
          set -euo pipefail
          ls -lh release-assets || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          generate_release_notes: true
          files: |
            release-assets/*.deb
