name: Build XanMod Patched Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_series:
        description: Kernel series to patch (for example 6.18.y)
        required: false
        default: 6.18.y
      patch_repo_url:
        description: URL of the patch repository
        required: false
        default: https://gitlab.com/xanmod/linux-patches.git
      exclude_patch_dirs:
        description: Comma-separated patch subdirectories to skip (for example binder,valve)
        required: false
        default: ""
      skip_failed_patches:
        description: Continue when a patch cannot be applied cleanly
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: x86_64
            kernel_arch: x86_64
            cross_compile: ""
            image_target: bzImage
            image_path: arch/x86/boot/bzImage
            extra_packages: ""
          - artifact_arch: arm64
            kernel_arch: arm64
            cross_compile: aarch64-linux-gnu-
            image_target: Image
            image_path: arch/arm64/boot/Image
            extra_packages: gcc-aarch64-linux-gnu

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            dwarves \
            fakeroot \
            flex \
            libelf-dev \
            libssl-dev \
            rsync \
            ${{ matrix.extra_packages }}

      - name: Apply XanMod patch stack
        run: |
          set -euo pipefail
          bash .github/scripts/apply-xanmod-patches.sh \
            "${{ github.event.inputs.kernel_series || '7.0.y' }}" \
            "${{ github.event.inputs.patch_repo_url || 'https://gitlab.com/xanmod/linux-patches.git' }}" \
            "${{ github.event.inputs.exclude_patch_dirs || '' }}" \
            "${{ github.event.inputs.skip_failed_patches || 'true' }}"

      - name: Configure kernel
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          mkdir -p "${build_dir}"
          make O="${build_dir}" ARCH="${{ matrix.kernel_arch }}" CROSS_COMPILE="${{ matrix.cross_compile }}" defconfig

      - name: Fetch XanMod kernel config
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          bash .github/scripts/fetch-xanmod-config.sh "${{ matrix.kernel_arch }}" "${build_dir}/.config"

      - name: Prepare kernel config (olddefconfig)
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          make O="${build_dir}" ARCH="${{ matrix.kernel_arch }}" CROSS_COMPILE="${{ matrix.cross_compile }}" olddefconfig

      - name: Build kernel image and modules
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          make -j"$(nproc)" \
            O="${build_dir}" \
            ARCH="${{ matrix.kernel_arch }}" \
            CROSS_COMPILE="${{ matrix.cross_compile }}" \
            "${{ matrix.image_target }}" modules

      - name: Build Debian kernel package
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          make -j"$(nproc)" \
            O="${build_dir}" \
            ARCH="${{ matrix.kernel_arch }}" \
            CROSS_COMPILE="${{ matrix.cross_compile }}" \
            KDEB_BUILDDIR="${build_dir}" \
            KBUILD_PACKAGE_ORIGIN="XanMod" \
            KBUILD_BUILD_VERSION="1" \
            bindeb-pkg 2>&1 | tee "${build_dir}/bindeb.log" || true

      - name: Collect Debian packages
        run: |
          set -euo pipefail
          build_dir="build-${{ matrix.artifact_arch }}"
          mkdir -p "deb-packages-${{ matrix.artifact_arch }}"
          find . -maxdepth 2 -type f \( -name "*.deb" -o -name "*.buildinfo" -o -name "*.changes" \) -exec cp {} "deb-packages-${{ matrix.artifact_arch }}/" \; 2>/dev/null || echo "No DEB packages found"
          ls -lh "deb-packages-${{ matrix.artifact_arch }}"/ || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb-${{ matrix.artifact_arch }}
          path: deb-packages-${{ matrix.artifact_arch }}
          if-no-files-found: warn
          retention-days: 7
